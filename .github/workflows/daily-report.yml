name: Daily report (WhatsApp)

# 13:00 UTC = 6:30 PM IST, Mon-Fri: refresh rating changes for held stocks,
# build each person's report (daily_reports), send the WhatsApp summary.
# Report page: /report/<YYYY-MM-DD>-<person>. Built by ingest/daily_report.py.
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      send:
        description: "Send WhatsApp messages (false = build only)"
        type: boolean
        default: true
      since:
        description: "Testing only: look back to this UTC time (e.g. 2026-11-25T13:00:00+00:00); empty = since the previous report"
        type: string
        default: ""
      template:
        description: "Instead of a report: submit the WhatsApp template to Meta, or check its approval"
        type: choice
        options: [none, submit, status, inbox_scan]
        default: none

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
  WHATSAPP_TO_RIYA: ${{ secrets.WHATSAPP_TO_RIYA }}
  WHATSAPP_TO_VIJAY: ${{ secrets.WHATSAPP_TO_VIJAY }}   # unset = Vijay's report is built but not sent
  GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}            # newsletter inbox (ingest/newsletters.py)
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Newsletter inbox scan (senders only, results to DB — logs are public)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.template == 'inbox_scan' }}
        run: python -m ingest.newsletters --scan
      - name: WhatsApp template admin
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.template == 'submit' || inputs.template == 'status') }}
        run: python -m ingest.daily_report --template ${{ inputs.template }}
      - name: Analyst rating changes for held stocks (~25 tickers)
        if: ${{ github.event_name == 'schedule' || inputs.template == 'none' }}
        run: python -m ingest.analyst_ratings
        continue-on-error: true
      - name: Short-seller news for held stocks (Google News + AI target check)
        if: ${{ github.event_name == 'schedule' || inputs.template == 'none' }}
        run: python -m ingest.short_sellers
        continue-on-error: true
      - name: Build reports and send WhatsApp
        if: ${{ github.event_name == 'schedule' || inputs.template == 'none' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.send }}" = "true" ]; then
            python -m ingest.daily_report --send
          elif [ -n "${{ inputs.since }}" ]; then
            python -m ingest.daily_report --print --since "${{ inputs.since }}" | grep -E '"takeaway"|built'
          else
            python -m ingest.daily_report
          fi
