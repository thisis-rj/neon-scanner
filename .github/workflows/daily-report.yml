name: Daily report (WhatsApp)

# 13:00 UTC = 6:30 PM IST, Mon-Fri: refresh rating changes for held stocks,
# build each person's report (daily_reports), send the WhatsApp summary.
# Report page: /report/<YYYY-MM-DD>-<person>. Built by ingest/daily_report.py.
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      send:
        description: "Send WhatsApp messages (false = build only)"
        type: boolean
        default: true
      template:
        description: "Instead of a report: submit the WhatsApp template to Meta, or check its approval"
        type: choice
        options: [none, submit, status]
        default: none

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
  WHATSAPP_TO_RIYA: ${{ secrets.WHATSAPP_TO_RIYA }}
  WHATSAPP_TO_VIJAY: ${{ secrets.WHATSAPP_TO_VIJAY }}   # unset = Vijay's report is built but not sent

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: WhatsApp template admin
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.template != 'none' }}
        run: python -m ingest.daily_report --template ${{ inputs.template }}
      - name: Analyst rating changes for held stocks (~25 tickers)
        if: ${{ github.event_name == 'schedule' || inputs.template == 'none' }}
        run: python -m ingest.analyst_ratings
        continue-on-error: true
      - name: Short-seller news for held stocks (Google News + AI target check)
        if: ${{ github.event_name == 'schedule' || inputs.template == 'none' }}
        run: python -m ingest.short_sellers
        continue-on-error: true
      - name: Build reports and send WhatsApp
        if: ${{ github.event_name == 'schedule' || inputs.template == 'none' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.send }}" = "true" ]; then
            python -m ingest.daily_report --send
          else
            python -m ingest.daily_report
          fi
