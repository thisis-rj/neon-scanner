name: Tests

# Parser fixture tests + scorer unit tests (pytest), the holdings view /
# fund_flows SQL tests (Postgres in PGlite), and the /funds TypeScript rules.
# No secrets, no network beyond installs.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/sql/package-lock.json
      - run: npm ci
      - run: node --test

  web-rules:
    # Pure TypeScript rules for /funds (label, filters, sort, rollup), run
    # straight from web/lib with Node's type stripping — no build, no deps.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --experimental-strip-types tests/web/*.test.mjs
