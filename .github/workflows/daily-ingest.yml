name: Daily ingest

# Runs in GitHub-hosted runners so it works regardless of whether the user's
# laptop is on. Free tier (2000 min/month for private repos) easily covers.
#
# Structure: 2 parallel jobs that DON'T overlap each other on the same external
# service. Yahoo-touching scripts are serialised inside one job; SEC EDGAR
# scripts in the other. Both jobs share secrets via env: at workflow level.

on:
  schedule:
    # 22:00 UTC weekdays = 6 PM ET (winter) / 5 PM ET (summer) — main daily pipeline.
    - cron: '0 22 * * 1-5'
    # 22:00 UTC Sunday — weekly analyst pass.
    - cron: '0 22 * * 0'
    # 23:00 UTC on 16th of Feb/May/Aug/Nov — quarterly DERA refresh
    # (day after 13F deadline so SEC has published the new quarter's bulk data).
    - cron: '0 23 16 2,5,8,11 *'
  workflow_dispatch:

concurrency:
  group: daily-ingest
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
  EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  # ──────────────────────────────────────────────────────────────────
  # YAHOO PIPELINE — every ingest that hits Yahoo Finance.
  # Serialised so we never have two yfinance loops hitting Yahoo from
  # the same GH runner IP simultaneously (which risks rate-limit/ban).
  # ──────────────────────────────────────────────────────────────────
  yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5h ceiling. prices.py @ 0.3s × 10K = ~50min PLUS Yahoo AUM + iShares + etf_metrics. Bumped May 2026 after scheduled runs were consistently timing out at the original 90min and dropping Q1 13F ingest.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Capture Yahoo daily AUM (all 34 ETFs)
        run: python -m ingest.etf_aum_yahoo
        continue-on-error: true

      - name: Refresh iShares daily (10 ETFs)
        # iShares.com endpoint, NOT Yahoo — placed here for serial-with-yahoo
        # convenience since it's quick.
        run: python -m ingest.etf_shares_ishares --days 7
        continue-on-error: true

      - name: Daily price snapshot (universe — ~10K tickers @ 0.3s/tick = ~50min)
        run: python -m ingest.prices
        continue-on-error: true

      - name: Rebuild etf_metrics
        # Reads Supabase + light Yahoo touches per-ticker
        run: python -m ingest.etf_metrics
        continue-on-error: true

      - name: Refresh upcoming earnings dates + 1w/1m returns (large-cap ∪ filer holdings)
        # Powers the /earnings tab. Per-ticker Yahoo calls (~1-2k names), paced —
        # last Yahoo step so nothing waits on it.
        run: python -m ingest.earnings_calendar
        continue-on-error: true

      - name: Mag7 sleeve — month-end signal + model sleeve (8 tickers, ~5s)
        # Personal strategy tracker on /lag7 (CLAUDE.md §2.2 exception).
        # Idempotent; writes only new month-ends / fills. Needs migration 030.
        run: python -m ingest.mag7
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # SEC EDGAR PIPELINE — every ingest that hits sec.gov.
  # All scripts use 8 req/sec pacing (under SEC's 10/s limit).
  # ──────────────────────────────────────────────────────────────────
  sec-edgar:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5h ceiling. 8-K Groq summarization (paced ~10/min) + parse_13f/13d/form4 + form4_universe combined exceeds the original 90min on filing-heavy days. Bumped May 2026 after Q1 13F deadline runs timed out.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Parser and scorer tests
        # A broken parser must not write rows. Same suite as tests.yml.
        run: python -m pytest -q
        continue-on-error: false

      - name: Apply pending migrations
        # Runs BEFORE every other ingest step so new columns/tables exist by the
        # time parsers try to write to them. Idempotent — uses CREATE IF NOT EXISTS.
        run: python -m ingest.migrate
        continue-on-error: false  # block the pipeline if schema fails to apply

      - name: Poll EDGAR for new filings
        run: python -m ingest.edgar
        continue-on-error: true

      - name: Parse 13F holdings
        run: python -m ingest.parse_13f
        continue-on-error: true

      - name: Parse 13D/13G events
        run: python -m ingest.parse_13d
        continue-on-error: true

      - name: Parse Form 4 for tracked filers
        run: python -m ingest.parse_form4
        continue-on-error: true

      - name: Form 4 universe scan — incremental (last 7 days)
        # Daily scraper for the current quarter (not yet in SEC's bulk dataset).
        # SEC bulk Form 4 dataset publishes quarterly ~6 weeks after quarter end,
        # so the daily scrape only fills the gap between (last published bulk)
        # and (today). With bulk backfill done, this is fast — ~7 daily indices.
        run: python -m ingest.form4_universe --days 7
        continue-on-error: true

      - name: Summarize new 8-K filings (Groq, ~10/min limit)
        run: python -m ingest.summarize_8k --limit 20
        continue-on-error: true

      - name: Refresh public N-PORT XML (Mondays only)
        if: ${{ github.event.schedule == '0 22 * * 1' || github.event_name == 'workflow_dispatch' }}
        run: python -m ingest.etf_flows --years 1
        continue-on-error: true

      - name: Compute BUY signals (signals_latest table — read source for /signals page)
        # Runs last in the SEC pipeline so it sees the freshest 13F + insider + 13D data
        run: python -m ingest.compute_buy_signals
        continue-on-error: true

      - name: Resolve CUSIPs → tickers via OpenFIGI (incremental)
        # Maps CUSIPs from holdings_13f rows to tickers. Run BEFORE cost_basis
        # so cost_basis can use the freshly-resolved tickers. Idempotent —
        # only POSTs unknown CUSIPs each run. Anonymous OpenFIGI is rate-limited
        # at 25 req/min × 10 jobs = 250 CUSIPs/min; full backfill (~8K) once,
        # then daily incremental is <1 min.
        run: python -m ingest.cusip_resolver
        continue-on-error: true

      - name: Estimate per-(filer, ticker) cost basis via per-quarter VWAP proxy
        # Runs after compute_buy_signals so the latest holdings are reflected.
        # VWAPs are cached permanently per (ticker, quarter) so daily incremental
        # runs are fast (~2-5 min); first full run is ~30-60 min.
        run: python -m ingest.cost_basis
        continue-on-error: true

      - name: Compute 13F-clone trailing returns (1Y / 3Y) per filer
        # Reuses the ticker_quarter_vwap cache from cost_basis as entry prices.
        # Fast (<1 min). Powers the per-card track-record display on /holdings.
        run: python -m ingest.filer_returns
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # WEEKLY: AI analyst pass on watchlist (Sundays only — Groq calls cost
  # money + rate-limit at ~10 RPM so run sparingly).
  # ──────────────────────────────────────────────────────────────────
  analyst-pass:
    # DISABLED — the Analysis page is hidden, so the weekly Groq analyst pass is
    # turned off to stop paid API calls. To re-enable, replace `if: false` with
    # the original trigger below:
    #   if: |
    #     github.event_name == 'workflow_dispatch' ||
    #     github.event.schedule == '0 22 * * 0'
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Analyst pass on watchlist (skip names analyzed in last 7 days)
        run: python -m ingest.analyze_ticker --watchlist --skip-recent 168

  # ──────────────────────────────────────────────────────────────────
  # QUARTERLY: DERA bulk refresh (Feb 16, May 16, Aug 16, Nov 16 — day
  # after 13F deadline so we don't race the SEC's publish window).
  # ──────────────────────────────────────────────────────────────────
  dera-refresh:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 23 16 2,5,8,11 *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Parser and scorer tests
        # form4_universe_bulk below writes insider rows; don't run it on a broken parser.
        run: python -m pytest -q
      - name: Refresh DERA monthly (latest quarter only)
        run: python -m ingest.etf_flows_monthly --years 0.5

      - name: Refresh SEC bulk Form 4 dataset (latest quarter)
        # Insider transactions bulk dataset — 4x/year SEC publish cadence.
        # ~10 sec per quarter, single-shot vs the slow daily scraper.
        run: python -m ingest.form4_universe_bulk --years 0.5
