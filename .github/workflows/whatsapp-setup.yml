name: WhatsApp setup (manual)

# One-off admin actions on the WhatsApp Cloud API number used for the daily
# report. Run by hand from the Actions tab. Never prints the token or PIN.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status = show number status; set_pin = two-step PIN via settings call; register = (re)register the number with WHATSAPP_PIN as its two-step PIN"
        required: true
        default: status
        type: choice
        options: [status, set_pin, register, oba_status, send_test, create_template, template_status]

env:
  GRAPH: https://graph.facebook.com/v21.0
  PHONE_NUMBER_ID: "1047051355158686"   # +91 95890 61463 (not secret)
  WABA_ID: "956091127378728"            # WhatsApp Business Account "Aglet" (not secret)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Token check (type, expiry, permissions — never the token itself)
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          curl -sS "$GRAPH/debug_token?input_token=$TOKEN&access_token=$TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin).get('data',{}); print(json.dumps({k:d.get(k) for k in ('type','application','is_valid','expires_at','scopes')},indent=2))"

      - name: Number status
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "$GRAPH/$PHONE_NUMBER_ID?fields=display_phone_number,verified_name,name_status,new_name_status,code_verification_status,quality_rating,platform_type,status,messaging_limit_tier,is_official_business_account" \
            | python3 -m json.tool

      - name: Turn on two-step verification
        if: ${{ inputs.action == 'set_pin' }}
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PIN: ${{ secrets.WHATSAPP_PIN }}
        run: |
          [ ${#PIN} -eq 6 ] || { echo "WHATSAPP_PIN must be exactly 6 digits"; exit 1; }
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"pin\":\"$PIN\"}" "$GRAPH/$PHONE_NUMBER_ID" | python3 -m json.tool

      - name: Register number with two-step PIN
        if: ${{ inputs.action == 'register' }}
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PIN: ${{ secrets.WHATSAPP_PIN }}
        run: |
          [ ${#PIN} -eq 6 ] || { echo "WHATSAPP_PIN must be exactly 6 digits"; exit 1; }
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"messaging_product\":\"whatsapp\",\"pin\":\"$PIN\"}" "$GRAPH/$PHONE_NUMBER_ID/register" | python3 -m json.tool

      - name: Official business account (badge) status
        if: ${{ inputs.action == 'oba_status' }}
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" "$GRAPH/$PHONE_NUMBER_ID/official_business_account" | python3 -m json.tool
          curl -sS -H "Authorization: Bearer $TOKEN" "$GRAPH/$PHONE_NUMBER_ID?fields=official_business_account,is_official_business_account,throughput,messaging_limit_tier,eligibility_for_api_business_global_search" | python3 -m json.tool

      - name: Send test message (Meta's pre-approved hello_world template)
        if: ${{ inputs.action == 'send_test' }}
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          TO: ${{ secrets.WHATSAPP_TO_RIYA }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"messaging_product\":\"whatsapp\",\"to\":\"$TO\",\"type\":\"template\",\"template\":{\"name\":\"hello_world\",\"language\":{\"code\":\"en_US\"}}}" \
            "$GRAPH/$PHONE_NUMBER_ID/messages" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({'ok': 'messages' in d, 'error': d.get('error',{}).get('message')}, indent=2))"

      - name: Submit the daily-report template to Meta
        if: ${{ inputs.action == 'create_template' }}
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          cat > /tmp/tpl.json <<'JSON'
          {
            "name": "neon_daily_report",
            "language": "en",
            "category": "UTILITY",
            "components": [
              {"type": "HEADER", "format": "TEXT", "text": "Neon daily report: {{1}}", "example": {"header_text": ["27 Nov"]}},
              {"type": "BODY",
               "text": "Market: {{1}}\nInsider (non-routine): {{2}}\nShort sellers: {{3}}\nRatings: {{4}}\nEarnings: {{5}}",
               "example": {"body_text": [["Nasdaq -1.2%, Bitcoin -3%, gold +0.4%", "NVDA director sold $300M (unplanned)", "None on your stocks", "INSM downgraded by William Blair", "NVDA reports 19 Nov"]]}},
              {"type": "BUTTONS", "buttons": [
                {"type": "URL", "text": "Open full report",
                 "url": "https://neon-scanner-riya1910jain-2522s-projects.vercel.app/report/{{1}}",
                 "example": ["2026-11-27"]}
              ]}
            ]
          }
          JSON
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d @/tmp/tpl.json "$GRAPH/$WABA_ID/message_templates" | python3 -m json.tool

      - name: Template approval status
        if: ${{ inputs.action == 'template_status' }}
        env:
          TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" "$GRAPH/$WABA_ID/message_templates?name=neon_daily_report&fields=name,status,category,rejected_reason" | python3 -m json.tool
